name: Generate Pacman & Superman Flight Contribution Animation

on:
  schedule:
    - cron: "0 */12 * * *" # runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          theme: github-dark

      - name: Generate Superman Flight Contribution Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/superman-flight.svg?color_snake=#f5af19&color_dots=#0a1128,#1c3166,#0052cc,#e63946,#f5af19
            dist/superman-flight-dark.svg?color_snake=#f5af19&color_dots=#050c1e,#0d2040,#0052cc,#e63946,#f5af19
            dist/superman-flight.gif?color_snake=#f5af19&color_dots=#0a1128,#1c3166,#0052cc,#e63946,#f5af19&color_background=#050c1e
            dist/sandworm-dune.svg?color_snake=#f5af19&color_dots=#0a1128,#1c3166,#0052cc,#e63946,#f5af19
            dist/sandworm-dune.gif?color_snake=#f5af19&color_dots=#0a1128,#1c3166,#0052cc,#e63946,#f5af19&color_background=#050c1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare mirror paths for dist compatibility
        run: |
          mkdir -p dist/dist
          cp dist/*.svg dist/*.gif dist/dist/ 2>/dev/null || true

      - name: Push animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}